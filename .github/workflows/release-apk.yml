name: Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build JS Sandbox & Embed Assets
        run: |
          mkdir -p android/app/src/main/assets
          npm run build:sandbox
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Prebuild Native Android
        run: npm run prebuild:clean

      - name: Build Standalone Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy Release APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/*.apk output/Newflix-universal-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/Newflix-universal-release.apk
          name: Newflix ${{ github.ref_name }}
          body: |
            ## Newflix Release ${{ github.ref_name }}
            - Universal TV (Android TV, Google TV, Fire TV) and Mobile support
            - Pre-configured provider catalog from `nikhil2001gowda/newflix-providers`
          draft: false
          prerelease: false
